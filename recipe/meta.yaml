{% set version = "2.8.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-jmv
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/jmv_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/jmv/jmv_{{ version }}.tar.gz
  sha256: 65a19876c5a39e5809aa71011fb298d1b893d01181843ca5b863ab2130ff8226

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-afex >=0.28_0
    - r-bayesfactor
    - r-car >=3.0.0
    - r-dplyr
    - r-emmeans >=1.4.2
    - r-ggally
    - r-ggplot2 >=2.2.1
    - r-ggrepel
    - r-ggridges
    - r-gparotation
    - r-hmisc
    - r-jmvcore >=2.4.2
    - r-lavaan
    - r-magrittr
    - r-mass
    - r-matrixstats
    - r-multcomp
    - r-mvnormtest
    - r-nnet
    - r-psych >=1.7.5
    - r-r6
    - r-rocr
    - r-vcd
    - r-vcdextra
  run:
    - r-base
    - r-afex >=0.28_0
    - r-bayesfactor
    - r-car >=3.0.0
    - r-dplyr
    - r-emmeans >=1.4.2
    - r-ggally
    - r-ggplot2 >=2.2.1
    - r-ggrepel
    - r-ggridges
    - r-gparotation
    - r-hmisc
    - r-jmvcore >=2.4.2
    - r-lavaan
    - r-magrittr
    - r-mass
    - r-matrixstats
    - r-multcomp
    - r-mvnormtest
    - r-nnet
    - r-psych >=1.7.5
    - r-r6
    - r-rocr
    - r-vcd
    - r-vcdextra

test:
  commands:
    - $R -e "library('jmv')"           # [not win]
    - "\"%R%\" -e \"library('jmv')\""  # [win]

about:
  home: https://www.jamovi.org/jmv/
  dev_url: https://github.com/jamovi/jmv
  license: GPL-2.0-or-later
  summary: A suite of common statistical methods such as descriptives, t-tests, ANOVAs, regression, correlation matrices, proportion tests, contingency tables, and factor analysis. This package is also useable from the 'jamovi' statistical spreadsheet (see <https://www.jamovi.org> for more information).
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
